# =============================================================================
# Improved Conditional GAN Configuration
# =============================================================================
# Key changes from baseline:
#   - Hinge loss + spectral normalization (proven SNGAN/BigGAN approach)
#   - Residual blocks in generator for better gradient flow
#   - Higher capacity networks (wider channels)
#   - Two-timescale learning rates (TTUR): lower lr_g, higher lr_d
#   - Exponential moving average (EMA) of generator weights
#   - Minibatch stddev for mode-collapse detection
#   - Larger latent dimension for richer representations
#
# NOTE: Spectral norm enforces the Lipschitz constraint that hinge loss
# requires. Do NOT combine spectral norm with WGAN-GP (gradient penalty),
# as double-constraining the critic causes it to collapse.
# =============================================================================

model:
  latent_dim: 128
  embed_dim: 64
  num_classes: 10
  image_channels: 3
  image_size: 32
  generator_channels: [512, 256, 128]
  discriminator_channels: [128, 256, 512]
  leaky_relu_slope: 0.2
  init_std: 0.02

  # Architecture selection
  generator_type: "improved"
  discriminator_type: "improved"

  # Generator: BN + ReLU + residual (standard for G)
  g_activation: "relu"
  g_normalization: "batchnorm"
  g_use_residual: true
  g_dropout: 0.0

  # Discriminator: spectral norm + LeakyReLU (SNGAN standard)
  d_activation: "leaky_relu"
  d_normalization: "spectralnorm"
  d_use_minibatch_stddev: true
  d_dropout: 0.0

training:
  batch_size: 64
  num_epochs: 100
  lr_g: 0.0002
  lr_d: 0.0002
  beta1: 0.0
  beta2: 0.999
  weight_decay_g: 0.0
  weight_decay_d: 0.0
  d_steps: 1
  g_steps: 1
  label_smooth_real: 1.0
  label_smooth_fake: 0.0

  # Hinge loss — the standard loss for spectral-norm GANs
  # Unlike WGAN-GP, hinge loss does NOT need gradient penalty because
  # spectral normalization already enforces the Lipschitz constraint.
  loss_type: "hinge"
  gp_lambda: 10.0

  # Exponential Moving Average of generator weights
  use_ema: true
  ema_decay: 0.999

  # Gradient clipping (0 = disabled)
  grad_clip_g: 0.0
  grad_clip_d: 0.0

data:
  dataset: "cifar10"
  data_root: "./data/cifar10"
  num_workers: 4
  pin_memory: true
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    random_rotation: false
    random_rotation_degrees: 10
    color_jitter: false
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    color_jitter_hue: 0.1
    random_resized_crop: false
    random_resized_crop_scale_min: 0.8
    random_resized_crop_scale_max: 1.0

evaluation:
  save_every: 10
  sample_every: 5
  num_sample_per_class: 10
  log_every: 100

seed: 42

paths:
  checkpoint_dir: "./checkpoints_improved"
  results_dir: "./results_improved"
