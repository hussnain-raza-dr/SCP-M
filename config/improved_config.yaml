# =============================================================================
# Improved Conditional GAN Configuration
# =============================================================================
# Strategy: SNGAN + TTUR approach
#   - SAME proven DCGAN architecture as baseline (ConvTranspose2d / strided Conv)
#   - Add spectral normalization on D (replaces BatchNorm — SNGAN paper)
#   - Hinge loss (the standard loss for spectral-norm discriminators)
#   - TTUR: higher D learning rate (0.0004) vs G (0.0001) to prevent D collapse
#   - 2:1 D:G update ratio for discriminator stability
#   - beta2=0.9 (standard SNGAN setting, faster adaptation than 0.999)
#   - Wider channels for higher capacity
#   - EMA of generator weights for smoother inference
#   - Larger latent dim and embedding dim
#
# This is the approach from Miyato et al. "Spectral Normalization for GANs"
# which is proven to work reliably on CIFAR-10 at 32x32.
#
# NOTE: Do NOT combine spectral norm with WGAN-GP gradient penalty —
# double-constraining the Lipschitz constant causes the critic to collapse.
# =============================================================================

model:
  latent_dim: 128
  embed_dim: 64
  num_classes: 10
  image_channels: 3
  image_size: 32

  # Wider channels than baseline [256,128,64] / [64,128,256]
  generator_channels: [512, 256, 128]
  discriminator_channels: [128, 256, 512]
  leaky_relu_slope: 0.2
  init_std: 0.02

  # Use the standard DCGAN architecture (NOT residual blocks)
  generator_type: "baseline"
  discriminator_type: "baseline"

  # Key improvement: spectral norm on D instead of batch norm
  # This enforces the Lipschitz constraint needed for hinge loss
  # without the instability of batch norm in the discriminator
  d_normalization: "spectralnorm"

training:
  batch_size: 64
  num_epochs: 200
  # TTUR (Two Time-Scale Update Rule) — give D a higher LR to keep up with G
  lr_g: 0.0001
  lr_d: 0.0004
  beta1: 0.0
  beta2: 0.9        # standard for SNGAN (0.999 was too slow to adapt)
  weight_decay_g: 0.0
  weight_decay_d: 0.0
  d_steps: 2        # train D twice per G step to prevent D collapse
  g_steps: 1
  label_smooth_real: 1.0
  label_smooth_fake: 0.0

  # Hinge loss — the standard loss for spectral-norm GANs
  loss_type: "hinge"
  gp_lambda: 10.0

  # R1 gradient penalty on real images (Mescheder et al., 2018)
  # Prevents discriminator from losing ability to recognize reals.
  # Small value is enough — this complements spectral norm, not replaces it.
  r1_gamma: 1.0

  # Linear LR decay: ramp to 0 over the last 50% of training (SNGAN standard)
  lr_decay_start: 0.5

  # EMA of generator weights for better inference quality
  use_ema: true
  ema_decay: 0.999

  grad_clip_g: 0.0
  grad_clip_d: 0.0

data:
  dataset: "cifar10"
  data_root: "./data/cifar10"
  num_workers: 4
  pin_memory: true
  augmentation:
    horizontal_flip: true
    horizontal_flip_p: 0.5
    random_rotation: false
    random_rotation_degrees: 10
    color_jitter: false
    color_jitter_brightness: 0.2
    color_jitter_contrast: 0.2
    color_jitter_saturation: 0.2
    color_jitter_hue: 0.1
    random_resized_crop: false
    random_resized_crop_scale_min: 0.8
    random_resized_crop_scale_max: 1.0

evaluation:
  save_every: 10
  sample_every: 5
  num_sample_per_class: 10
  log_every: 100

seed: 42

paths:
  checkpoint_dir: "./checkpoints_improved"
  results_dir: "./results_improved"
